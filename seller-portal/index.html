<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de Vendedor | Creaciones Baby</title>
    <meta name="description" content="Panel de vendedor de Creaciones Baby: gestiona productos, promociones, inventario, reportes y pagos." />
    <meta name="theme-color" content="#5c4c3e" />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

    <!-- Tailwind CSS CDN (same design tokens as the storefront app for brand consistency) -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#5c4c3e",
              "primary-hover": "#4a3e35",
              "baby-pink": "#fdf2f4",
              "baby-pink-dark": "#fbcfe8",
              "tech-blue": "#0284c7",
              "background-light": "#fcfbfa",
              "background-dark": "#161514",
            },
            fontFamily: {
              "sans": ["Manrope", "sans-serif"],
              "display": ["Manrope", "sans-serif"]
            },
            borderRadius: {
              "DEFAULT": "0.25rem",
              "lg": "0.5rem",
              "xl": "0.75rem",
              "full": "9999px"
            },
          },
        },
      }
    </script>
  </head>
  <body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-sans transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
